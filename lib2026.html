<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0a">
<title>LIB 2026 Squad Up!</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0a0a0a;color:#fff;font-family:'DM Sans',system-ui,sans-serif;overscroll-behavior:none;overflow:hidden}
:root{
  --gold:#F5A623;--gdim:rgba(245,166,35,.15);
  --surf:rgba(255,255,255,.05);--bdr:rgba(255,255,255,.08);
  --mut:rgba(255,255,255,.35);
  --col:192px;--row:60px;--tgut:52px;
}
.screen{display:none;height:100vh;flex-direction:column;overflow:hidden}
.screen.active{display:flex}

/* LOADING */
#loading{position:fixed;inset:0;background:#0a0a0a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:9999}
#loading h2{font-size:34px;font-weight:900;letter-spacing:-.02em}
#loading p{font-size:13px;color:var(--mut)}

/* SPLASH */
#splash{background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(245,166,35,.18) 0%,transparent 65%);overflow-y:auto;align-items:center;justify-content:center;padding:40px 24px 60px}
.sp{width:100%;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center}
.sp-eye{font-size:11px;letter-spacing:.25em;color:var(--mut);text-transform:uppercase;margin-bottom:10px;text-align:center}
.sp-h1{font-size:60px;font-weight:900;line-height:.9;letter-spacing:-.03em;text-align:center;margin-bottom:8px}
.sp-h1 span{color:var(--gold)}
.sp-sub{font-size:15px;font-weight:700;color:rgba(255,255,255,.65);margin-bottom:5px;text-align:center}
.sp-loc{font-size:13px;color:var(--mut);margin-bottom:32px;text-align:center}
.flbl{font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;display:block;margin-bottom:8px}
.fgrp{width:100%;margin-bottom:18px}
input[type=text]{width:100%;padding:14px 16px;background:rgba(255,255,255,.07);border:1px solid var(--bdr);border-radius:14px;color:#fff;font-size:16px;font-family:inherit;outline:none;transition:border .15s}
input[type=text]:focus{border-color:rgba(245,166,35,.5)}
input[type=password]:focus{border-color:rgba(245,166,35,.5)}
input[type=text]::placeholder{color:rgba(255,255,255,.2)}
.ewrap{width:100%;overflow-x:auto;margin-bottom:20px;scrollbar-width:none}
.ewrap::-webkit-scrollbar{display:none}
.egrid{display:flex;flex-wrap:wrap;gap:10px;width:max-content;padding:4px}
.ebtn{width:64px;height:64px;border-radius:14px;font-size:34px;background:var(--surf);border:1px solid var(--bdr);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ebtn:active{transform:scale(.88)}
.ebtn.dim{opacity:.25;cursor:not-allowed;border-style:dashed}
.ebtn.sel{background:var(--gdim);border:2px solid rgba(245,166,35,.7);transform:scale(1.08);box-shadow:0 0 18px rgba(245,166,35,.3)}
.jbtn{width:100%;padding:17px;background:var(--gold);color:#000;border:none;border-radius:16px;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer;transition:all .15s}
.jbtn:disabled{background:rgba(255,255,255,.1);color:rgba(255,255,255,.2);cursor:default}
.sqprev{margin-top:24px;text-align:center;width:100%}
.sqlbl{font-size:11px;color:var(--mut);margin-bottom:10px}
.sqchips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.sqchip{display:flex;align-items:center;gap:6px;background:var(--surf);border-radius:20px;padding:4px 10px 4px 6px;font-size:13px;color:rgba(255,255,255,.6)}

/* HEADER */
.hdr{flex-shrink:0;background:rgba(10,10,10,.98);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);padding:12px 16px 0;z-index:50}
.hdr-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hdr-logo{font-size:20px;font-weight:900;letter-spacing:-.01em}
.hdr-logo span{color:var(--gold)}
.mechip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border-radius:20px;padding:7px 14px 7px 10px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;border:1px solid rgba(255,255,255,.15);font-family:inherit;transition:background .15s}
.mechip:active{background:rgba(255,255,255,.15)}
.dtabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;height:48px}
.dtabs::-webkit-scrollbar{display:none}
.dtab{flex-shrink:0;padding:6px 16px;border-radius:10px 10px 0 0;border:none;cursor:pointer;font-family:inherit;background:transparent;border-bottom:2px solid transparent;color:var(--mut);transition:all .15s;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dtab.on{background:var(--gdim);border-bottom-color:var(--gold);color:var(--gold)}
.dtab .dl{font-size:13px;font-weight:800;letter-spacing:.04em}
.dtab .dd{font-size:10px;opacity:.7;margin-top:1px}

/* GRID */
.gcont{flex:1;display:flex;overflow:hidden;position:relative}
.tgut{width:var(--tgut);flex-shrink:0;overflow:hidden;position:relative;border-right:1px solid var(--bdr);z-index:10;background:#0a0a0a}
.tgut-i{position:absolute;top:0;left:0;right:0}
.tlbl{height:var(--row);display:flex;align-items:flex-start;padding:4px 6px 0 0;justify-content:flex-end;font-size:10px;color:var(--mut);font-weight:600;white-space:nowrap}
.sscr{flex:1;overflow-x:auto;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent;touch-action:pan-x pan-y pinch-zoom;scroll-snap-type:x mandatory}
.sscr::-webkit-scrollbar{height:4px;width:4px}
.sscr::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:2px}
.si{display:flex;min-height:100%}
.scol{width:var(--col);flex-shrink:0;border-right:1px solid var(--bdr);position:relative;scroll-snap-align:start}
.schdr{position:sticky;top:0;z-index:20;height:36px;display:flex;align-items:center;justify-content:center;padding:0 8px;gap:5px;background:rgba(10,10,10,.96);border-bottom:1px solid var(--bdr)}
.scdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.scnm{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gbg{position:absolute;top:36px;left:0;right:0;bottom:0;pointer-events:none}
.grow{height:var(--row);border-bottom:1px solid rgba(255,255,255,.04)}
.grow.hr{border-bottom-color:rgba(255,255,255,.09)}
.scarts{position:absolute;top:36px;left:0;right:0}

/* ARTIST BLOCKS */
.ab{position:absolute;left:4px;right:4px;border-radius:10px;cursor:pointer;padding:6px 8px;overflow:hidden;border:1px solid transparent;transition:background .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
.ab:active{opacity:.75;transform:scale(.97)}
.ab .abn{font-size:15px;font-weight:800;color:#fff;line-height:1.2;margin-bottom:2px}
.ab .abt{font-size:12px;opacity:.55;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.ab .abg{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px}
.ab .abfp{display:flex;align-items:center;margin-top:auto;padding-top:3px;flex-wrap:nowrap}
.ab-going{display:flex;align-items:center;gap:3px;margin-top:2px;min-width:0}
.ab-going-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;display:none}
.ab-going-lbl{font-size:11px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff;font-weight:600}
.ab .abfl{font-size:9px;opacity:.5;margin-left:5px;white-space:nowrap}
.fc{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:13px;border:1.5px solid rgba(255,255,255,.25);flex-shrink:0}
.fc+.fc,.fcx{margin-left:-6px}
.fcx{width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;border:1.5px solid rgba(255,255,255,.25);flex-shrink:0;color:#fff}
@keyframes pickPop{0%{transform:scale(1)}40%{transform:scale(1.07)}70%{transform:scale(.97)}100%{transform:scale(1)}}
.ab.pop{animation:pickPop .35s cubic-bezier(.36,.07,.19,.97)}
@keyframes navPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.4)}}
.ab.nav{animation:navPulse .6s ease 3}


/* ZOOM CONTROLS */
.zoom-ctrls{position:fixed;bottom:24px;right:16px;z-index:101;display:flex;flex-direction:column;gap:8px;pointer-events:none}.zoom-ctrls>.zbtn{pointer-events:all}
.zbtn{width:48px;height:48px;border-radius:50%;background:#1a1a1a;border:1px solid rgba(255,255,255,.18);color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;line-height:1;box-shadow:0 4px 20px rgba(0,0,0,.6);transition:all .15s}
.zbtn:active{transform:scale(.92)}
/* BOTTOM SHEETS shared */
.bk{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
.bk.open{display:flex}
.sheet{background:#141414;border-radius:24px 24px 0 0;width:100%;max-width:540px;border:1px solid rgba(255,255,255,.12);overflow-y:auto;animation:slideUp .26s cubic-bezier(.32,.72,0,1);height:90vh;display:flex;flex-direction:column;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
/* Draggable drawer */
.sheet-handle{width:48px;height:5px;background:rgba(255,255,255,.25);border-radius:3px;margin:14px auto 0;flex-shrink:0;cursor:grab}
.sheet-handle:active{cursor:grabbing}
.sheet.dragging{transition:none!important;animation:none!important}
.sheet.snapping{transition:transform .3s cubic-bezier(.32,.72,0,1)}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.bk{touch-action:none}

.sp2{padding:20px 24px 48px}
.pill{width:36px;height:4px;background:rgba(255,255,255,.2);border-radius:2px;margin:0 auto 20px}

/* ARTIST MODAL */
.am-hdr{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.am-stag{display:inline-flex;border-radius:20px;padding:4px 10px;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.am-name{font-size:26px;font-weight:900;line-height:1.05;margin-bottom:4px}
.am-time{font-size:13px;color:var(--mut)}
.sptbtn{display:flex;align-items:center;gap:6px;background:#1DB954;color:#000;border-radius:20px;padding:8px 16px;font-size:12px;font-weight:800;text-decoration:none;flex-shrink:0;margin-left:12px;font-family:inherit;white-space:nowrap}
.am-genres{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.am-desc{font-size:13px;color:rgba(255,255,255,.5);line-height:1.6;margin-bottom:20px}
.tbns{display:flex;gap:10px;margin-bottom:22px}
.tbn{flex:1;padding:14px 8px;border-radius:14px;border:1.5px solid var(--bdr);background:var(--surf);color:#fff;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .15s}
.tbn.an{background:rgba(255,80,80,.18);border-color:rgba(255,80,80,.7);border-width:2px}
.tbn.ai{background:rgba(80,160,255,.15);border-color:rgba(100,180,255,.7);border-width:2px}
.attsec{margin-bottom:16px}
.attlbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.attchips{display:flex;flex-wrap:wrap;gap:8px}
.ach{display:flex;align-items:center;gap:6px;border-radius:20px;padding:5px 12px 5px 8px;font-size:13px;color:#fff}
.ach.n{background:rgba(255,80,80,.15);border:1px solid rgba(255,80,80,.4)}
.ach.i{background:rgba(80,160,255,.12);border:1px solid rgba(100,180,255,.4)}
.nopick{text-align:center;color:var(--mut);font-size:13px;padding:10px 0}

/* MY LINEUP */
#luBk{z-index:300}
.lu-sheet{display:flex;flex-direction:column;max-height:82vh;overflow:hidden}
.lu-hdr{padding:16px 24px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex-shrink:0;position:sticky;top:0;background:#141414;z-index:10}
.lu-title{font-size:26px;font-weight:900;margin-top:4px;letter-spacing:-.02em}
.lu-scr{overflow-y:auto;padding:16px 24px 40px;flex:1}
.lu-day{margin-bottom:0;border-bottom:2px solid rgba(255,255,255,.05)}
.lu-dlbl{font-size:13px;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);margin-bottom:0;padding:14px 16px 12px;border-bottom:2px solid rgba(245,166,35,.3)}
.lu-item{display:flex;align-items:center;gap:14px;padding:18px 16px;border-radius:0;margin-bottom:0;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.07)}
.lu-item.n{background:rgba(255,80,80,.12);border-left:3px solid rgba(255,80,80,.8);border-bottom:1px solid rgba(255,255,255,.06)}
.lu-item.i{background:rgba(80,160,255,.1);border-left:3px solid rgba(100,180,255,.8);border-bottom:1px solid rgba(255,255,255,.06)}
.lu-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:2px;flex-shrink:0}
.lu-info{flex:1;min-width:0}
.lu-name{font-size:18px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.lu-meta{font-size:13px;color:var(--mut);margin-top:3px}
.lu-others{font-size:12px;color:var(--gold);margin-top:4px;opacity:.9;font-weight:700}
.lu-tier{font-size:26px;flex-shrink:0}
.lu-empty{text-align:center;padding:48px 24px;color:var(--mut);font-size:18px;line-height:1.7;font-weight:700}

/* SEARCH */
#srBk{z-index:400}
.sr-row{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:0 14px;margin-bottom:14px}
.sr-row span{font-size:18px;flex-shrink:0}
.sr-row input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:20px;font-family:inherit;padding:13px 0}
.sr-row input::placeholder{color:rgba(255,255,255,.25)}
.sr-list{max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.sri{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.05);cursor:pointer;border:1px solid rgba(255,255,255,.06)}
.sri:active{background:rgba(255,255,255,.08)}
.sri-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.sri-info{flex:1;min-width:0}
.sri-name{font-size:19px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sri-meta{font-size:14px;color:var(--mut);margin-top:1px}
.sri-day{font-size:11px;font-weight:700;background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);border-radius:8px;padding:2px 8px;flex-shrink:0}
.sr-empty{text-align:center;color:var(--mut);font-size:14px;padding:32px 0}

/* FAB ROW */
.fabs{position:fixed;bottom:24px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;z-index:100;pointer-events:none}
.fabs > *{pointer-events:all}
.sfab{width:46px;height:46px;background:#1a1a1a;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.6);transition:all .15s}
.sfab:active{transform:scale(.92)}
.lfab{background:#1a1a1a;border:1px solid rgba(255,255,255,.15);border-radius:24px;padding:10px 20px;display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:#fff;font-family:inherit;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,.6);transition:all .15s;white-space:nowrap}
.lfab:active{transform:scale(.96)}
.fcnt{background:var(--gold);color:#000;border-radius:12px;padding:1px 7px;font-size:12px;font-weight:800;min-width:20px;text-align:center}

/* SYNC */
.sync{position:fixed;bottom:148px;right:16px;transform:none;background:rgba(15,15,15,.9);border:1px solid var(--bdr);border-radius:20px;padding:5px 10px;font-size:11px;color:var(--mut);display:flex;align-items:center;gap:6px;z-index:60}
.sdot{width:6px;height:6px;border-radius:50%;background:#555}
.sdot.ok{background:#50C878;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
/* Emoji picker drawer */
.emoji-picker-bk{display:none;position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);align-items:flex-end;justify-content:center}
.emoji-picker-bk.open{display:flex}
.emoji-picker-sheet{background:#1a1a1a;border-radius:24px 24px 0 0;width:100%;max-width:540px;border:1px solid rgba(255,255,255,.12);padding:0 0 40px;animation:slideUp .25s cubic-bezier(.32,.72,0,1);max-height:60vh;display:flex;flex-direction:column}
.emoji-picker-header{padding:16px 20px 12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.07)}
.emoji-picker-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:12px 16px;overflow-y:auto;flex:1}
.ep-btn{width:100%;aspect-ratio:1;border-radius:12px;border:2px solid transparent;background:transparent;cursor:pointer;font-size:28px;display:flex;align-items:center;justify-content:center;transition:all .12s;line-height:1}
.ep-btn:active{transform:scale(.88);background:rgba(255,255,255,.1)}
.ep-btn.ep-sel{background:rgba(245,166,35,.15);border-color:rgba(245,166,35,.6)}

/* Emoji avatar circles */
.eav{width:28px;height:28px;border-radius:50%;background:#2a2a2a;
  display:inline-flex;align-items:center;justify-content:center;
  font-size:15px;border:2px solid #0a0a0a;flex-shrink:0;line-height:1;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.eav-sm{width:20px;height:20px;font-size:11px;border-radius:50%;background:#2a2a2a;
  display:inline-flex;align-items:center;justify-content:center;
  border:2px solid #0a0a0a;flex-shrink:0;line-height:1;box-shadow:0 0 0 1px rgba(255,255,255,.12)}
.eav-stack{display:flex;flex-direction:row;align-items:center}
.eav-stack .eav+.eav,.eav-stack .eav-sm+.eav-sm{margin-left:-7px}
/* Quick pick circles in search */
.qpick{width:38px;height:38px;border-radius:50%;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .15s;flex-shrink:0}
.qpick:active{transform:scale(.88)}
.qpick.qn{border-color:rgba(255,80,80,.7);background:rgba(255,70,70,.2)}
.qpick.qi{border-color:rgba(100,180,255,.7);background:rgba(80,160,255,.2)}


/* ── DESKTOP / RESPONSIVE ── */
@media (min-width: 600px) {
  #splash{justify-content:center}
  .sp{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:40px 40px 48px;max-width:460px}
  .sp-h1{font-size:52px}
  #main .hdr{padding:14px 24px 0}
  .gcont{font-size:105%}
  .bk{align-items:center!important}
  .sheet{border-radius:24px!important;max-height:85vh;margin:auto}
  .lu-sheet{border-radius:24px!important;max-height:85vh;margin:auto}
  .fabs{bottom:28px}
  .zoom-ctrls{bottom:28px}
  .sync{bottom:auto;top:14px;right:20px}
}
</style>
</head>
<body>

<div id="loading"><h2>&#9889; LIB 2026</h2><p>Loading&#8230;</p></div>

<!-- SPLASH -->
<div class="screen" id="splash">
<div class="sp">
  <div class="sp-eye">Lightning in a Bottle</div>
  <div class="sp-h1">&#9889; LIB<br><span>2026</span></div>
  <div class="sp-sub">Squad Up!</div>
  <div class="sp-loc">May 20&ndash;24 &middot; Buena Vista Lake, CA</div>

  <div id="authTabs" style="display:flex;width:100%;margin-bottom:24px;border-radius:14px;overflow:hidden;border:1px solid var(--bdr)">
    <button id="tabLogin" onclick="switchTab('login')" style="flex:1;padding:13px;background:rgba(245,166,35,.15);border:none;color:var(--gold);font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;border-right:1px solid var(--bdr)">Log In</button>

function loadLocal(){
  try{var s=localStorage.getItem("lib26_db");if(s)db=JSON.parse(s);}catch(e){}
  if(!db.users)db.users={};
  if(!db.picks)db.picks={};
}
function saveLocal(){
  localStorage.setItem("lib26_db",JSON.stringify(db));
}
async function saveDB(){
  saveLocal();
  if(!fbDb||!fbUpd)return;
  try{await fbUpd(fbRef("lib26"),db);setSyncOK(true);}catch(e){setSyncOK(false);}
}
function setSyncOK(ok){
  document.getElementById("syncDot").className="sdot"+(ok?" ok":"");
  document.getElementById("syncTxt").textContent=ok?"Live":"Local";
}


// Simple password hash (djb2) — good enough for a festival app
function hashPass(str){
  var h=5381;
  for(var i=0;i<str.length;i++)h=((h<<5)+h)^str.charCodeAt(i);
  return (h>>>0).toString(36);
}
function nameIsTaken(name,excludeId){
  return Object.entries(db.users||{}).some(function(e){
    return e[0]!==excludeId&&e[1].name&&e[1].name.toLowerCase()===name.toLowerCase();
  });
}
function emojiIsTaken(emoji,excludeId){
  return Object.entries(db.users||{}).some(function(e){
    return e[0]!==excludeId&&e[1].emoji===emoji;
  });
}


// ── FIREBASE (background, non-blocking) ──────────────────────────────────────
function initFB(){
  if(!FB_ON)return;
  // Load Firebase SDK immediately and sync db
  Promise.all([
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"),
    import("https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js")
  ]).then(function(modules){
    var m=modules[0], db_m=modules[1];
    try{ var app=m.initializeApp(FBC); }
    catch(e){ var app=m.getApp(); }
    fbDb=db_m.getDatabase(app);
    fbRef=function(p){return db_m.ref(fbDb,p);};
    fbOnVal=db_m.onValue;
    fbUpd=db_m.update;
    // Fetch full db immediately
    db_m.get(fbRef("lib26")).then(function(snap){
      if(snap.exists()){
        var fresh=snap.val();
        if(fresh){db=fresh;if(!db.users)db.users={};if(!db.picks)db.picks={};saveLocal();}
      }
      setSyncOK(true);
      // Live updates
      db_m.onValue(fbRef("lib26"),function(snap){
        if(snap.exists()){
          var fresh=snap.val();
          if(fresh){db=fresh;if(!db.users)db.users={};if(!db.picks)db.picks={};saveLocal();}
        }
        // Re-render squad preview if on splash
        if(document.getElementById('splash').classList.contains('active')) renderSquadPreview();
        // Re-render grid if on main
        if(document.getElementById('main').classList.contains('active')) renderGrid();
      });
    }).catch(function(e){console.log('FB sync error:',e);setSyncOK(false);});
  }).catch(function(e){console.log('FB load error:',e);setSyncOK(false);});
}

      showScreen("splash");

    }

  }catch(err){
    // Fallback: always show login if anything crashes at boot
    console.error("Boot error:",err);
    try{
      var loading=document.getElementById("loading");
      if(loading)loading.style.display="none";
      showScreen("splash");

});

    return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

async function doLogin(){
  var name=(document.getElementById('loginName')||{value:''}).value.trim();
  var pass=(document.getElementById('loginPass')||{value:''}).value.trim();
  var errEl=document.getElementById('loginError');
  var btn=document.getElementById('loginBtn');
  if(!name||!pass)return;
  var uid=name.toLowerCase().replace(/\s+/g,'_');
  if(errEl)errEl.textContent='';
  if(btn){btn.disabled=true;btn.textContent='Checking...';}

  // Wait up to 3s for Firebase to finish syncing if needed
  var waited=0;
  while(!(db.users&&db.users[uid])&&waited<6){
    await new Promise(function(r){setTimeout(r,500);});
    waited++;
    // Try loading from local storage again in case Firebase just wrote
    loadLocal();
  }

  var user=db.users&&db.users[uid];
  if(!user){
    if(errEl)errEl.textContent='Username not found. Try joining the squad!';
    if(btn){btn.disabled=false;btn.textContent='Log In';}
    return;
  }
  if(user.pass!==hashPass(pass)){
    if(errEl)errEl.textContent='Wrong password. Try again.';
    if(btn){btn.disabled=false;btn.textContent='Log In';}
    return;
  }
  myId=uid;myPass=hashPass(pass);
  localStorage.setItem('lib26v2_uid',myId);
  localStorage.setItem('lib26v2_pass',myPass);
  if(btn){btn.disabled=false;btn.textContent='Log In';}
  goMain();
}


async function doJoin(){
  var name=(document.getElementById('nameInput')||{}).value||'';
  var pass=(document.getElementById('passInput')||{}).value||'';
  name=name.trim();pass=pass.trim();
  if(!name||!pass||!selEmoji)return;
  var uid=name.toLowerCase().replace(/\s+/g,'_');
  var errEl=document.getElementById('joinError');
  if(errEl)errEl.textContent='';
  if(!db.users)db.users={};
  if(!db.picks)db.picks={};
  // Check if username taken
  if(db.users[uid]&&db.users[uid].pass&&db.users[uid].pass!==hashPass(pass)){
    if(errEl)errEl.textContent='That name is taken. Try a different one.';return;
  }
  // Check emoji uniqueness
  if(emojiIsTaken(selEmoji,uid)){
    if(errEl)errEl.textContent='That emoji is taken! Pick a different one.';return;
  }
  myId=uid;myPass=hashPass(pass);
  db.users[uid]={name:name,emoji:selEmoji,pass:myPass};
  if(!db.picks[uid])db.picks[uid]={};
  localStorage.setItem('lib26v2_uid',myId);
  localStorage.setItem('lib26v2_pass',myPass);
  await saveDB();
  goMain();
}

function buildTimeGutter(){
  var totalH=SLOTS*SH;
  var gut=document.getElementById("timeGutter");
  gut.style.height=(36+totalH)+"px";
  var html='<div style="height:36px"></div>';
  for(var i=0;i<=SLOTS;i++){
    var mins=DS+i*30;
    var wrap=mins>=1440?mins-1440:mins;
    var h=Math.floor(wrap/60),m=wrap%60;
    var ap=h<12?"a":"p";
    var h12=h%12||12;
    var lbl=m===0?h12+ap:"";
    html+='<div class="tlbl">'+lbl+'</div>';
  }
  gut.innerHTML=html;
  var scr=document.getElementById("stagesScroll");
  gut.onscroll=null;
  scr.onscroll=function(){gut.scrollTop=scr.scrollTop;};
}

    var bg=document.createElement("div");
    bg.className="gbg";
    for(var i=0;i<SLOTS;i++){
      var row=document.createElement("div");
      row.className="grow"+(i%2===0?" hr":"");
      bg.appendChild(row);
    }
    colDiv.appendChild(bg);
    // artists
    var arts=document.createElement("div");
    arts.className="scarts";
    artists.forEach(function(a){
      var rng=tr(a.time);
      var s=rng[0],e=rng[1];
      if(s<DS)s+=1440;
      if(e<=s)e+=1440;
      var top=((s-DS)/30)*SH;
      var height=Math.max(((e-s)/30)*SH-2,28);
      var tier=myPicks[a.id]||null;
      // Build block
      var blk=document.createElement("div");
      blk.className="ab"+(tier?" pop":""); // pop will animate once then stay
      blk.dataset.id=a.id;
      // Colors
      var bg2,bdr,shadow="";
      if(tier==="need"){
        bg2="rgba(255,60,60,0.38)";bdr="rgba(255,90,90,0.95)";
        shadow="box-shadow:0 0 18px rgba(255,60,60,.45),inset 0 0 0 1px rgba(255,130,130,.3)";
      } else if(tier==="interested"){
        bg2="rgba(60,150,255,0.3)";bdr="rgba(100,180,255,0.95)";
        shadow="box-shadow:0 0 18px rgba(60,150,255,.4),inset 0 0 0 1px rgba(130,200,255,.3)";
      } else {
        bg2=col+"22";bdr=col+"55";
      }
      blk.style.cssText="top:"+top+"px;height:"+height+"px;background:"+bg2+";border-color:"+bdr+";"+shadow;
      // Content

      var picks=db.picks||{};var users=db.users||{};
      var needPickers=Object.keys(picks).filter(function(uid){return picks[uid][a.id]==="need"&&users[uid];});
      var intPickers=Object.keys(picks).filter(function(uid){return picks[uid][a.id]==="interested"&&users[uid];});

      function goingLabel(uids, verb){
        var n=uids.length;
        if(n===0)return "";
        var stack='<span class="eav-stack">';
        uids.slice(0,2).forEach(function(uid){
          stack+='<span class="eav-sm">'+users[uid].emoji+'</span>';
        });
        stack+='</span>';
        var lbl='';
        if(n===1) lbl=users[uids[0]].name.split(' ')[0]+' '+verb;
        else if(n===2) lbl=users[uids[0]].name.split(' ')[0]+' + '+users[uids[1]].name.split(' ')[0]+' '+verb;
        else lbl=n+' '+verb;
        return '<div class="ab-going">'+stack+'<span class="ab-going-lbl">'+lbl+'</span></div>';
      }
      var goingHtml=needPickers.length?goingLabel(needPickers,'Going'):'';
      var intHtml=intPickers.length?goingLabel(intPickers,'Interested'):'';
      blk.innerHTML='<div class="abn">'+esc(a.name)+'</div>'
        +'<div class="abt">'+a.time+'</div>'
        +''
        +goingHtml+intHtml;
      blk.onclick=function(aid){return function(){openAM(aid);};}(a.id);
      arts.appendChild(blk);
    });
    colDiv.appendChild(arts);
    inner.appendChild(colDiv);
  });
}
// ZOOM
var gridZoom = 1.0;
function adjustZoom(delta){
  gridZoom = Math.min(1.0, Math.max(0.4, gridZoom + delta));
  var inner = document.getElementById("stagesInner");
  var gutter = document.getElementById("timeGutter");
  inner.style.transformOrigin = "top left";
  inner.style.transform = "scale("+gridZoom+")";
  inner.style.width = (100/gridZoom)+"%";
  // Scale gutter too
  gutter.style.transformOrigin = "top left";
  gutter.style.transform = "scale("+gridZoom+")";
  gutter.style.width = (100/gridZoom)+"%";
}

function updateFabCnt(){
  var picks=db.picks&&db.picks[myId]?db.picks[myId]:{};
  document.getElementById("fabCnt").textContent=Object.keys(picks).length;
}

// ── ARTIST MODAL ──────────────────────────────────────────────────────────────
function openAM(artistId){
  var found=null;
  for(var i=0;i<DAYS.length;i++){
    var a=DAYS[i].artists.find(function(x){return x.id===artistId;});
    if(a){found=a;break;}
  }
  if(!found)return;
  curArtist=found;
  var col=SC[found.stage]||"#aaa";
  document.getElementById("amStag").textContent=found.stage;
  document.getElementById("amStag").style.cssText="background:"+col+"22;border:1px solid "+col+"44;color:"+col;
  document.getElementById("amName").textContent=found.name;
  document.getElementById("amTime").textContent=found.time;
  document.getElementById("amSpot").href=found.spotify;
  // genres
  var gEl=document.getElementById("amGenres");
  gEl.innerHTML="";
  if(found.genres){
    found.genres.split(" · ").forEach(function(g){
      var sp=document.createElement("span");
      sp.textContent=g;
      sp.style.cssText="font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;"
        +"background:"+col+"22;color:"+col+";border:1px solid "+col+"44;border-radius:20px;padding:3px 10px";
      gEl.appendChild(sp);
    });
  }
  document.getElementById("amDesc").textContent=found.desc||"";
  updateAMBtns();
  renderAMAtt();
  document.getElementById("amBk").classList.add("open");
}
function closeAM(e){
  if(e&&e.target!==document.getElementById("amBk"))return;
  document.getElementById("amBk").classList.remove("open");
  curArtist=null;
}
function updateAMBtns(){
  if(!curArtist)return;
  var tier=db.picks&&db.picks[myId]?db.picks[myId][curArtist.id]||null:null;
  document.getElementById("btnNeed").className="tbn"+(tier==="need"?" an":"");
  document.getElementById("btnInt").className="tbn"+(tier==="interested"?" ai":"");
}
function renderAMAtt(){
  if(!curArtist){document.getElementById("amAtt").innerHTML="";return;}
  var picks=db.picks||{};var users=db.users||{};
  var all=Object.keys(picks).filter(function(uid){return picks[uid][curArtist.id]&&users[uid];})
    .map(function(uid){return{user:users[uid],tier:picks[uid][curArtist.id]};});
  var need=all.filter(function(x){return x.tier==="need";});
  var intr=all.filter(function(x){return x.tier==="interested";});
  var html="";
  if(need.length){
    html+='<div class="attsec"><div class="attlbl">&#128293; Need to see ('+need.length+')</div>'
      +'<div class="attchips">'+need.map(function(x){
        return '<div class="ach n"><span>'+x.user.emoji+'</span><span>'+esc(x.user.name)+'</span></div>';
      }).join("")+'</div></div>';
  }
  if(intr.length){
    html+='<div class="attsec"><div class="attlbl">&#10024; Interested ('+intr.length+')</div>'
      +'<div class="attchips">'+intr.map(function(x){
        return '<div class="ach i"><span>'+x.user.emoji+'</span><span>'+esc(x.user.name)+'</span></div>';
      }).join("")+'</div></div>';
  }
  if(!all.length)html='<div class="nopick">No one has picked this yet — be first!</div>';
  document.getElementById("amAtt").innerHTML=html;
}
async function setPick(tier){
  if(!curArtist||!myId)return;
  if(!db.picks)db.picks={};
  if(!db.picks[myId])db.picks[myId]={};
  var cur=db.picks[myId][curArtist.id];
  var newTier=cur===tier?null:tier;
  if(newTier===null)delete db.picks[myId][curArtist.id];
  else db.picks[myId][curArtist.id]=newTier;
  // IMMEDIATE visual feedback — update buttons and grid before async save
  updateAMBtns();
  renderAMAtt();
  renderGrid();
  updateFabCnt();
  // Haptic feedback on supported devices
  if(navigator.vibrate)navigator.vibrate(30);
  // Pop animation on block
  var blk=document.querySelector('.ab[data-id="'+curArtist.id+'"]');
  if(blk){blk.classList.remove("pop");void blk.offsetWidth;blk.classList.add("pop");}
  // Save in background
  saveDB();
}

// ── MY LINEUP ─────────────────────────────────────────────────────────────────
function openLU(){
  var me=db.users&&db.users[myId];
  if(!me)return;
  document.getElementById("luTitle").innerHTML=me.emoji+" My Lineup";
  var picks=db.picks&&db.picks[myId]?db.picks[myId]:{};
  var scr=document.getElementById("luScr");
  scr.innerHTML="";
  if(!Object.keys(picks).length){
    scr.innerHTML='<div class="lu-empty">No picks yet!<br>Tap any artist and mark it &#128293; or &#10024;</div>';
    document.getElementById("luBk").classList.add("open");
    return;
  }
  DAYS.forEach(function(day){
    var dp=day.artists.filter(function(a){return picks[a.id];});
    if(!dp.length)return;
    dp.sort(function(a,b){
      var ra=tr(a.time),rb=tr(b.time);
      var na=ra[0]<DS?ra[0]+1440:ra[0];
      var nb=rb[0]<DS?rb[0]+1440:rb[0];
      return na-nb;
    });
    var dayDiv=document.createElement("div");
    dayDiv.className="lu-day";
    dayDiv.innerHTML='<div class="lu-dlbl">'+day.label+' · '+day.date+'</div>';
    dp.forEach(function(a){
      var tier=picks[a.id];
      var col=SC[a.stage]||"#aaa";
      var el=document.createElement("div");
      el.className="lu-item "+tier;
      // Who else is going to this artist?
      var allPicks=db.picks||{};var allUsers=db.users||{};
      var others=Object.keys(allPicks).filter(function(uid){
        return uid!==myId&&allPicks[uid][a.id]&&allUsers[uid];
      });
      var othersHtml="";
      if(others.length){
        var otherNames=others.slice(0,2).map(function(uid){
          return allUsers[uid].emoji+" "+allUsers[uid].name;
        }).join(", ")+(others.length>2?" +"+(others.length-2)+" more":"");
        othersHtml='<div class="lu-others">'+esc(otherNames)+' also going</div>';
      }
      el.innerHTML='<div class="lu-dot" style="background:'+col+'"></div>'
        +'<div class="lu-info">'
        +'<div class="lu-name">'+esc(a.name)+'</div>'
        +'<div class="lu-meta">'+esc(a.stage)+' · '+a.time+'</div>'
        +othersHtml
        +'</div>'
        +'<div class="lu-tier">'+(tier==="need"?"&#128293;":"&#10024;")+'</div>';
      el.onclick=(function(id){return function(){closeLUopenAM(id);};})(a.id);
      dayDiv.appendChild(el);
    });
    scr.appendChild(dayDiv);
  });
  document.getElementById("luBk").classList.add("open");
}

function closeLU(e){
  if(e&&e.target!==document.getElementById("luBk"))return;
  document.getElementById("luBk").classList.remove("open");
}
function closeLUopenAM(id){
  document.getElementById("luBk").classList.remove("open");
  setTimeout(function(){openAM(id);},180);
}

// ── SEARCH ────────────────────────────────────────────────────────────────────
function openSR(){
  document.getElementById("srBk").classList.add("open");
  setTimeout(function(){document.getElementById("srInput").focus();},120);
  renderSR("");
}
function closeSR(e){
  if(e&&e.target!==document.getElementById("srBk"))return;
  document.getElementById("srBk").classList.remove("open");
  document.getElementById("srInput").value="";
}
function renderSR(q){
  q=q.trim().toLowerCase();
  var myPicks=db.picks&&db.picks[myId]?db.picks[myId]:{};
  var allPicks=db.picks||{};
  function squadScore(aid){
    var s=0;
    Object.values(allPicks).forEach(function(p){
      if(p[aid]==="need")s+=2;else if(p[aid]==="interested")s+=1;
    });
    return s;
  }
  var all=[];
  DAYS.forEach(function(day){
    day.artists.forEach(function(a){all.push({a:a,day:day});});
  });
  var matches=q.length<1?all.slice(0,60):all.filter(function(item){
    var a=item.a;
    return a.name.toLowerCase().indexOf(q)>-1
      ||(a.genres||"").toLowerCase().indexOf(q)>-1
      ||a.stage.toLowerCase().indexOf(q)>-1;
  });
  var list=document.getElementById("srList");
  // Sort by squad score desc, then alpha
  matches.sort(function(x,y){
    var sd=squadScore(y.a.id)-squadScore(x.a.id);
    return sd!==0?sd:x.a.name.localeCompare(y.a.name);
  });
  matches=matches.slice(0,40);
  list.innerHTML="";
  if(!matches.length){
    list.innerHTML='<div class="sr-empty">No artists found</div>';
    return;
  }
  matches.forEach(function(item){
    var a=item.a,day=item.day;
    var col=SC[a.stage]||"#aaa";
    var tier=myPicks[a.id]||null;
    // Count squad interest for meta line
    var allP=db.picks||{};
    var needCnt=Object.keys(allP).filter(function(u){return allP[u][a.id]==="need";}).length;
    var intCnt=Object.keys(allP).filter(function(u){return allP[u][a.id]==="interested";}).length;
    var metaStr=esc(a.stage);
    if(needCnt>0)metaStr+=' · '+needCnt+' Going';
    else if(intCnt>0)metaStr+=' · '+intCnt+' Interested';

    // Always same size — active state shown only via button ring, not card size
    var el=document.createElement("div");
    el.className="sri";
    // Left content
    var dot=document.createElement("div");
    dot.className="sri-dot";
    dot.style.background=col;
    var info=document.createElement("div");
    info.className="sri-info";
    info.innerHTML='<div class="sri-name">'+esc(a.name)+'</div>'
      +'<div class="sri-meta">'+metaStr+'</div>';
    // Right: two circle buttons only
    var picks=document.createElement("div");
    picks.className="sri-picks";
    var bg=document.createElement("button");
    bg.className="qpick"+(tier==="need"?" qn":"");
    bg.textContent='🔥';
    bg.onclick=(function(aid){return function(ev){ev.stopPropagation();quickPick(aid,"need");};})(a.id);
    var bi=document.createElement("button");
    bi.className="qpick"+(tier==="interested"?" qi":"");
    bi.textContent='✨';
    bi.onclick=(function(aid){return function(ev){ev.stopPropagation();quickPick(aid,"interested");};})(a.id);
    picks.appendChild(bg);picks.appendChild(bi);
    el.appendChild(dot);el.appendChild(info);el.appendChild(picks);
    el.onclick=function(aid,dayid){return function(){navToArtist(aid,dayid);};}(a.id,day.id);
    list.appendChild(el);
  });
}
document.addEventListener("DOMContentLoaded",function(){
  document.getElementById("srInput").addEventListener("input",function(e){renderSR(e.target.value);});
});
async function quickPick(artistId,tier){
  if(!myId)return;
  if(!db.picks)db.picks={};
  if(!db.picks[myId])db.picks[myId]={};
  var cur=db.picks[myId][artistId];
  if(cur===tier)delete db.picks[myId][artistId];
  else db.picks[myId][artistId]=tier;
  if(navigator.vibrate)navigator.vibrate(30);
  saveDB();
  renderGrid();
  updateFabCnt();
  renderSR(document.getElementById("srInput").value||"");
}

function navToArtist(artistId,dayId){
  // close search
  document.getElementById("srBk").classList.remove("open");
  document.getElementById("srInput").value="";
  // switch day if needed
  if(activeDay!==dayId){
    activeDay=dayId;
    buildDayTabs();
    buildTimeGutter();
    renderGrid();
  }
  // find artist
  var targetArtist=null;
  var targetDay=null;
  for(var i=0;i<DAYS.length;i++){
    var a=DAYS[i].artists.find(function(x){return x.id===artistId;});
    if(a){targetArtist=a;targetDay=DAYS[i];break;}
  }
  if(!targetArtist)return;
  setTimeout(function(){
    var rng=tr(targetArtist.time);
    var s=rng[0];
    if(s<DS)s+=1440;
    var topPx=((s-DS)/30)*SH;
    var scr=document.getElementById("stagesScroll");
    var stageIdx=targetDay.stages.indexOf(targetArtist.stage);
    // Scroll both axes simultaneously, place item near top with padding
    var scrollTop=Math.max(0,topPx-40);
    var scrollLeft=stageIdx>=0?stageIdx*192:0;
    scr.scrollTo({top:scrollTop,left:scrollLeft,behavior:"smooth"});
    // Flash the block after scroll settles
    setTimeout(function(){
      var blk=document.querySelector('.ab[data-id="'+artistId+'"]');
      if(blk){
        blk.classList.remove("nav");
        void blk.offsetWidth;
        blk.classList.add("nav");
        // Also scroll into view precisely
        blk.scrollIntoView({behavior:"smooth",block:"start",inline:"start"});
      }
    },400);
  },60);
}

// ── DRAGGABLE DRAWER ─────────────────────────────────────────────────────────
(function(){
  var DISMISS_THRESHOLD = 0.35; // dismiss if dragged > 35% of sheet height

  function initDrag(bkEl){
    var sheetEl = bkEl.querySelector('.sheet');
    if(!sheetEl)return;

    var startY=0, currentY=0, isDragging=false, sheetH=0;

    function onStart(e){
      // Only start drag from handle or non-scrollable areas
      var target = e.target;
      var isScrollable = false;
      var el = target;
      while(el && el !== sheetEl){
        if(el.classList.contains('sheet-body') || el.classList.contains('sr-list') || el.classList.contains('lu-scr')){
          isScrollable = true; break;
        }
        el = el.parentElement;
      }
      // Allow drag from handle always; from non-scrollable areas of sheet
      var fromHandle = target.classList.contains('sheet-handle') || target.closest('.sheet-handle');
      if(!fromHandle && isScrollable) return;

      isDragging = true;
      sheetH = sheetEl.offsetHeight;
      startY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;
      currentY = 0;
      sheetEl.classList.add('dragging');
      sheetEl.classList.remove('snapping');
    }

    function onMove(e){
      if(!isDragging) return;
      var y = (e.type === 'touchmove' ? e.touches[0].clientY : e.clientY) - startY;
      if(y < 0) y = 0; // don't allow dragging up past origin
      currentY = y;
      sheetEl.style.transform = 'translateY('+y+'px)';
      // Fade backdrop
      var progress = Math.min(y / (sheetH * DISMISS_THRESHOLD * 2), 1);
      bkEl.style.background = 'rgba(0,0,0,'+(0.75*(1-progress*0.6))+')';
      if(e.cancelable) e.preventDefault();
    }

    function onEnd(){
      if(!isDragging) return;
      isDragging = false;
      sheetEl.classList.remove('dragging');

      if(currentY > sheetH * DISMISS_THRESHOLD){
        // Dismiss
        sheetEl.classList.add('snapping');
        sheetEl.style.transform = 'translateY(110%)';
        setTimeout(function(){
          bkEl.classList.remove('open');
          sheetEl.style.transform = '';
          sheetEl.classList.remove('snapping');
          bkEl.style.background = '';
          // Clear search input if search drawer
          var inp = bkEl.querySelector('#srInput');
          if(inp) inp.value = '';
        }, 300);
      } else {
        // Snap back
        sheetEl.classList.add('snapping');
        sheetEl.style.transform = '';
        bkEl.style.background = '';
        setTimeout(function(){ sheetEl.classList.remove('snapping'); }, 300);
      }
      currentY = 0;
    }

    // Touch events
    sheetEl.addEventListener('touchstart', onStart, {passive: true});
    sheetEl.addEventListener('touchmove', onMove, {passive: false});
    sheetEl.addEventListener('touchend', onEnd);
    // Mouse events for desktop
    sheetEl.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', function(e){ if(isDragging) onMove(e); });
    document.addEventListener('mouseup', function(e){ if(isDragging) onEnd(e); });
  }

  document.addEventListener('DOMContentLoaded', function(){
    ['amBk','profileBk','luBk','srBk'].forEach(function(id){
      var el = document.getElementById(id);
      if(el) initDrag(el);
    });
  });
})();
